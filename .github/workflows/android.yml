name: Android build and tests
on:
  push:
    branches:
      - main
      - feature/kino-resolvers-package
      - fix/abyss-quality-fragmented-sources
      - fix/abyss-segment-token-stream
      - integration/legacy-direct-plus-sora
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kino-resolvers-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
